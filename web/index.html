<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="لجستیک؛ سامانه هوشمند مدیریت حمل‌ونقل بار جاده‌ای برای رانندگان و متصدیان حمل‌ونقل">
  <meta name="theme-color" content="#0F766E">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="لجستیک">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png">
  <link rel="manifest" href="manifest.json">
  <title>لجستیک | مدیریت حمل‌ونقل بار</title>
  <link rel="preconnect" href="https://static.neshan.org" crossorigin>
  <link rel="stylesheet" href="https://static.neshan.org/sdk/mapboxgl/v1.13.2/neshan-sdk/v1.1.5/index.css">
  <script src="https://static.neshan.org/sdk/mapboxgl/v1.13.2/neshan-sdk/v1.1.5/index.js"></script>
  <script src="neshan_map_bridge.js"></script>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #f5f8f7; overscroll-behavior: none; }
    body { font-family: Arial, sans-serif; }
    #pwa-loader { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; color: #164e48; background: radial-gradient(circle at 50% 38%, #fff 0, #f0fdfa 45%, #e6f4f1 100%); transition: opacity 240ms ease, visibility 240ms ease; }
    #pwa-loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    #pwa-loader img { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 16px 36px rgba(15, 118, 110, .18); }
    #pwa-loader strong { font-size: 22px; }
    #pwa-loader span { font-size: 13px; color: #52716d; }
    .loader-ring { width: 30px; height: 30px; border: 3px solid rgba(15, 118, 110, .18); border-top-color: #0f766e; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: dark) {
      html, body { background: #0f1918; }
      #pwa-loader { color: #ccfbf1; background: radial-gradient(circle at 50% 38%, #18312e 0, #101c1b 55%, #0b1413 100%); }
      #pwa-loader span { color: #99b9b4; }
    }
  </style>
</head>
<body>
  <div id="pwa-loader" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="نشان لجستیک">
    <strong>لجستیک</strong>
    <div class="loader-ring" aria-hidden="true"></div>
    <span>در حال آماده‌سازی سامانه حمل‌ونقل…</span>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('pwa-loader');
      if (loader) {
        loader.classList.add('hidden');
        window.setTimeout(function () { loader.remove(); }, 300);
      }
    });
    window.addEventListener('load', function () {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('pwa_service_worker.js?v=1.0.0-1-20260921-4', { scope: './' })
          .catch(function (error) {
            console.warn('[Logistics PWA] Service worker registration failed:', error);
          });
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
